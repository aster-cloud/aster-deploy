global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 加载告警规则（与 K3S PrometheusRule 等价）
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'aster-api'
    metrics_path: /q/metrics
    static_configs:
      # 本覆盖层与 podman-compose.yml --profile full 叠加使用，aster-api 以容器 `api`
      # 运行在 compose 网络内的 8080。若改在宿主机 IDE 里跑 aster-api，请把这里
      # 临时改成 host.containers.internal:<宿主机端口>。
      - targets: ['api:8080']
        labels:
          service: aster-api

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
