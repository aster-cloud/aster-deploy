global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 加载告警规则（与 K3S PrometheusRule 等价）
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'aster-api'
    metrics_path: /q/metrics
    static_configs:
      # host.containers.internal 让容器访问 host loopback
      # aster-api 跑在 host 8090（避开 chrono-synth-web 占用的 8080）
      - targets: ['host.containers.internal:8090']
        labels:
          service: aster-api

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
