# Aster 全栈本地环境
# 用法:
#   全栈模式: podman-compose --profile full up -d
#   仅基础设施: podman-compose up -d
services:
  postgres:
    # ★大版本必须与生产一致（issue #10）。生产是 CNPG
    #   ghcr.io/cloudnative-pg/postgresql:16.4（k3s 仓
    #   apps/infrastructure/postgres-cluster/manifests/cluster.yaml:18，全仓唯一来源）。
    #   此前本地是 17-alpine，跨大版本的 SQL/行为差异在本地测不出来。
    #   ★改这行前先查生产实际版本——生产升级后本地才跟着升，不要反向。
    #
    # ★从 17 降到 16 需要**重建数据卷**：PG 拒绝在高版本 initdb 过的数据目录上启动。
    #   实测错误：`FATAL: database files are incompatible with server` /
    #   `The data directory was initialized by PostgreSQL version 17,
    #    which is not compatible with this version 16.14.`
    #
    #   已有本地环境执行：
    #       podman-compose down
    #       podman volume ls | grep postgres-data     # ★先确认卷名再删
    #       podman volume rm <上一步查到的卷名>
    #
    #   ★卷名不要写死：实测 podman-compose 5.1.4 用的是 **compose 文件所在目录**名
    #   （得 `compose_postgres-data`），而 compose 规范说的是工作目录名
    #   （应为 `aster-deploy_postgres-data`）。换 docker compose 或换版本可能不同，
    #   故用 `volume ls | grep` 自己确认。
    #
    #   重建无数据损失：entrypoint 每次启动都会重跑 Drizzle schema 同步并重插种子
    #   （种子 SQL 带 ON CONFLICT DO NOTHING，幂等）。
    image: docker.io/postgres:16-alpine
    container_name: aster-postgres
    ports:
      - "${LOCAL_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aster_policy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    container_name: aster-redis
    ports:
      - "${LOCAL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ${ASTER_API_DIR:-${ASTER_REPOS_DIR}/aster-api}
      dockerfile: Dockerfile.jvm
    container_name: aster-api
    ports:
      - "${LOCAL_API_PORT:-8080}:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/aster_policy
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/aster_policy
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
      ASTER_LLM_API_KEY: ${ASTER_LLM_API_KEY:-}
      ASTER_LLM_BASE_URL: ${ASTER_LLM_BASE_URL:-https://api.openai.com}
      ASTER_LLM_MODEL: ${ASTER_LLM_MODEL:-gpt-4o-mini}
      ASTER_LLM_PROVIDER: ${ASTER_LLM_PROVIDER:-openai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: ["full"]

  cloud:
    image: docker.io/node:24-alpine
    container_name: aster-cloud
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm run dev"
    ports:
      - "${LOCAL_CLOUD_PORT:-3000}:3000"
    volumes:
      - ${ASTER_CLOUD_DIR:-${ASTER_REPOS_DIR}/aster-cloud}:/app
      - cloud-node-modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${LOCAL_API_PORT:-8080}
      NEXT_PUBLIC_ASTER_POLICY_API_URL: http://localhost:${LOCAL_API_PORT:-8080}
      NEXT_PUBLIC_ASTER_POLICY_WS_URL: ws://localhost:${LOCAL_API_PORT:-8080}/ws/preview
      ASTER_POLICY_API_INTERNAL_URL: http://api:8080
    profiles: ["full"]

  lsp:
    image: docker.io/node:24-alpine
    container_name: aster-lsp
    working_dir: /app
    command: sh -c "node dist/lsp-server.mjs"
    ports:
      - "${LOCAL_LSP_PORT:-3001}:3001"
    volumes:
      - ${ASTER_CLOUD_DIR:-${ASTER_REPOS_DIR}/aster-cloud}:/app
    profiles: ["full"]

volumes:
  postgres-data:
  cloud-node-modules:
