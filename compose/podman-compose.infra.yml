# Aster 基础设施（仅 Postgres + Redis）
# 用于 IDE 调试：启动基础设施后从 IntelliJ 运行 aster-api（Quarkus dev mode）
# 用法: podman-compose -f compose/podman-compose.infra.yml up -d
services:
  postgres:
    image: docker.io/postgres:17-alpine
    container_name: aster-postgres
    ports:
      - "${LOCAL_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aster_policy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    container_name: aster-redis
    ports:
      - "${LOCAL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
