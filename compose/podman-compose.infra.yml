# Aster 基础设施（仅 Postgres + Redis）
# 用于 IDE 调试：启动基础设施后从 IntelliJ 运行 aster-api（Quarkus dev mode）
# 用法: podman-compose -f compose/podman-compose.infra.yml up -d
services:
  postgres:
    # ★与生产（CNPG 16.4）保持同一大版本（issue #10）。
    #   ★本仓共 **3 处** 声明 postgres 镜像，必须同步改：
    #     compose/podman-compose.yml、compose/podman-compose.infra.yml、
    #     scripts/e2e-local.sh（裸 podman run，不走 compose——最易漏）
    #   核对命令：grep -rn 'postgres:1[0-9]' --exclude-dir=.git .
    #   改一个漏一个会让「用哪条路径起的环境」决定你测到的是哪个大版本。
    image: docker.io/postgres:16-alpine
    container_name: aster-postgres
    ports:
      - "${LOCAL_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aster_policy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7-alpine
    container_name: aster-redis
    ports:
      - "${LOCAL_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
