# 测试环境覆盖层
# 用法: podman-compose -f podman-compose.yml -f podman-compose.test.yml --profile full up -d
# 功能: 禁用安全控制 + 种子测试用户（email+password 登录）
services:
  postgres:
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro

  api:
    environment:
      # 禁用安全控制，允许 curl/Postman 直接测试
      ASTER_SECURITY_SIGNATURE_ENABLED: "false"
      ASTER_SECURITY_RBAC_ENABLED: "false"
      ASTER_RATELIMIT_ENABLED: "false"
      ASTER_PII_ENFORCE: "false"
      ASTER_TENANT_STRICT_FORMAT: "false"

  cloud:
    command: sh /scripts/cloud-entrypoint.sh
    volumes:
      - ${ASTER_CLOUD_DIR:-${ASTER_REPOS_DIR}/aster-cloud}:/app
      - cloud-node-modules:/app/node_modules
      - ./seed:/seed:ro
      - ./scripts:/scripts:ro
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${LOCAL_API_PORT:-8080}
      NEXT_PUBLIC_ASTER_POLICY_API_URL: http://localhost:${LOCAL_API_PORT:-8080}
      NEXT_PUBLIC_ASTER_POLICY_WS_URL: ws://localhost:${LOCAL_API_PORT:-8080}/ws/preview
      ASTER_POLICY_API_INTERNAL_URL: http://api:8080
      # R32 audit P1：本文件仅用于本地 / CI test mode 启动。
      # NEXTAUTH_SECRET 是确定值是为了 e2e 测试可重现；DATABASE_URL 走
      # localhost-only podman bridge，不暴露任何端口到 host。生产环境
      # 用 k3s ExternalSecret + Vault，本文件永远不应在生产路径上。
      # 如果本字符串出现在生产日志 / pod env，立刻 page 安全团队。
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aster_cloud
      NEXTAUTH_SECRET: test-secret-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:${LOCAL_CLOUD_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
