# Aster 生态统一编排
# 安装 task: https://taskfile.dev/installation/
# 用法: task <name>  例如 task local:infra, task dev, task release
version: '3'

dotenv: ['.env']

vars:
  COMPOSE_FILE: compose/podman-compose.yml
  INFRA_COMPOSE_FILE: compose/podman-compose.infra.yml
  TEST_COMPOSE_FILE: compose/podman-compose.test.yml
  # 检测 Podman socket 路径（macOS 上 docker-compose 需要 DOCKER_HOST 指向 Podman）
  PODMAN_SOCKET:
    sh: |
      if command -v podman >/dev/null 2>&1 && command -v podman-machine-default >/dev/null 2>&1 || podman machine inspect podman-machine --format '{{`{{.ConnectionInfo.PodmanSocket.Path}}`}}' 2>/dev/null; then
        true
      fi
  DOCKER_HOST_VAL:
    sh: |
      if [ -n "${DOCKER_HOST:-}" ]; then echo "$DOCKER_HOST";
      elif command -v podman >/dev/null 2>&1; then
        sock="$(podman machine inspect podman-machine --format '{{`{{.ConnectionInfo.PodmanSocket.Path}}`}}' 2>/dev/null || true)"
        if [ -n "$sock" ] && [ -e "$sock" ]; then echo "unix://$sock";
        else echo ""; fi
      else echo ""; fi
  RUNTIME:
    sh: |
      if command -v podman-compose >/dev/null 2>&1; then echo "podman-compose";
      elif command -v docker-compose >/dev/null 2>&1; then echo "docker-compose";
      elif command -v docker >/dev/null 2>&1; then echo "docker compose";
      else echo "podman-compose"; fi

env:
  DOCKER_HOST: '{{.DOCKER_HOST_VAL}}'

tasks:
  # ╔══════════════════════════════════════════╗
  # ║              模式入口                     ║
  # ╚══════════════════════════════════════════╝

  local:
    desc: 全栈本地环境（Podman Compose 容器化）
    cmds:
      - task: preflight
        vars: { MODE: local }
      - task: dev
      - '{{.RUNTIME}} -f {{.COMPOSE_FILE}} --profile full up -d'
      - task: verify:local

  local:infra:
    desc: 仅启动基础设施（Postgres + Redis），用于 IDE 调试
    cmds:
      - task: preflight
        vars: { MODE: infra }
      - '{{.RUNTIME}} -f {{.INFRA_COMPOSE_FILE}} up -d'
      - echo ""
      - 'echo "✓ 基础设施已启动（Postgres:${LOCAL_PG_PORT:-5432}, Redis:${LOCAL_REDIS_PORT:-6379}）"'
      - echo ""
      - echo "下一步："
      - echo "  1. IntelliJ → 运行 aster-api（Quarkus dev mode, 端口 8080）"
      - echo "  2. 终端 → cd aster-cloud && pnpm run dev（端口 3000）"
      - echo "  3. task verify:local — 检查服务状态"
      - echo "  4. task local:stop — 停止基础设施"

  local:test:
    desc: 全栈测试环境（安全禁用 + 测试用户）
    cmds:
      - task: preflight
        vars: { MODE: local }
      - task: dev
      - '{{.RUNTIME}} -f {{.COMPOSE_FILE}} -f {{.TEST_COMPOSE_FILE}} --profile full up -d'
      - task: verify:test

  local:stop:
    desc: 停止所有本地容器
    cmds:
      - '{{.RUNTIME}} -f {{.COMPOSE_FILE}} -f {{.TEST_COMPOSE_FILE}} --profile full down 2>/dev/null || true'
      - '{{.RUNTIME}} -f {{.COMPOSE_FILE}} --profile full down 2>/dev/null || true'
      - '{{.RUNTIME}} -f {{.INFRA_COMPOSE_FILE}} down 2>/dev/null || true'

  local:logs:
    desc: 查看本地容器日志
    cmds:
      - '{{.RUNTIME}} -f {{.INFRA_COMPOSE_FILE}} logs -f 2>/dev/null || {{.RUNTIME}} -f {{.COMPOSE_FILE}} --profile full logs -f'

  local:clean:
    desc: 删除本地容器和数据卷
    cmds:
      - '{{.RUNTIME}} -f {{.COMPOSE_FILE}} -f {{.TEST_COMPOSE_FILE}} --profile full down -v 2>/dev/null || true'
      - '{{.RUNTIME}} -f {{.COMPOSE_FILE}} --profile full down -v 2>/dev/null || true'
      - '{{.RUNTIME}} -f {{.INFRA_COMPOSE_FILE}} down -v 2>/dev/null || true'

  dev:
    desc: 构建全部项目到本地（mavenLocal + pnpm）
    cmds:
      - task: preflight
        vars: { MODE: dev }
      - task: build:core
      - task: build:after-core
      - task: build:truffle
      - task: build:api
      - task: build:cloud

  build:after-core:
    desc: core 之后可并行的构建（packs + runtime + ts）
    deps:
      - build:packs
      - build:runtime
      - build:ts

  release:
    desc: 完整发布流水线（构建 → 发布 → 容器 → 部署 → 验证）
    cmds:
      - task: preflight
        vars: { MODE: release }
      - task: dev
      - task: publish:jvm
      - task: publish:npm
      - task: container:api
      - task: container:lsp
      - task: deploy:api
      - task: deploy:lsp
      - task: deploy:cloud
      - task: verify

  # ╔══════════════════════════════════════════╗
  # ║              构建任务                     ║
  # ╚══════════════════════════════════════════╝

  build:core:
    desc: 构建 aster-lang-core
    cmds:
      - ./scripts/gradle-build.sh lang-core --publish-local

  build:packs:
    desc: 构建语言包（en/zh/de 并行）
    deps:
      - build:pack-en
      - build:pack-zh
      - build:pack-de

  build:pack-en:
    desc: 构建 aster-lang-en
    cmds:
      - ./scripts/gradle-build.sh lang-en --publish-local

  build:pack-zh:
    desc: 构建 aster-lang-zh
    cmds:
      - ./scripts/gradle-build.sh lang-zh --publish-local

  build:pack-de:
    desc: 构建 aster-lang-de
    cmds:
      - ./scripts/gradle-build.sh lang-de --publish-local

  build:runtime:
    desc: 构建 aster-lang-runtime
    cmds:
      - ./scripts/gradle-build.sh lang-runtime --publish-local

  build:truffle:
    desc: 构建 aster-lang-truffle
    cmds:
      - ./scripts/gradle-build.sh lang-truffle --publish-local

  build:api:
    desc: 构建 aster-api
    cmds:
      - ./scripts/gradle-build.sh api

  build:ts:
    desc: 构建 aster-lang-ts
    cmds:
      - ./scripts/pnpm-build.sh lang-ts

  build:cloud:
    desc: 构建 aster-cloud
    cmds:
      - ./scripts/pnpm-build.sh cloud

  # ╔══════════════════════════════════════════╗
  # ║            发布任务（release）             ║
  # ╚══════════════════════════════════════════╝

  publish:jvm:
    desc: 发布 JVM 构件到 GitHub Packages
    cmds:
      - ./scripts/gradle-publish.sh lang-core lang-en lang-zh lang-de lang-runtime lang-truffle

  publish:npm:
    desc: 发布 aster-lang-ts 到 npm
    cmds:
      - ./scripts/pnpm-publish.sh lang-ts

  # ╔══════════════════════════════════════════╗
  # ║          容器镜像（release）               ║
  # ╚══════════════════════════════════════════╝

  container:api:
    desc: 构建并推送 aster-api 容器镜像
    cmds:
      - ./scripts/container-build-push.sh api wontlost/aster-api {{.API_IMAGE_TAG | default "jvm-latest"}}

  container:lsp:
    desc: 构建并推送 aster-lsp 容器镜像
    cmds:
      # ★不再默认可变 tag 0.0.9（issue #9）：生产 lsp Deployment 是
      #   aster-lsp:0.0.9 + imagePullPolicy: IfNotPresent —— 往同一个 tag 反复推，
      #   节点只要有缓存就**静默继续跑旧镜像**，rollout restart 也换不掉。
      #   现在必须显式给一个不可变 tag；不给就报错，绝不再悄悄复用 0.0.9。
      #   长期方向：由 aster-cloud CI 的 build-lsp-image job 推已签名的
      #   :${{ github.sha }} 并纳入 k3s digest-pin（见 aster-deploy#9）。
      - |
        TAG="{{.LSP_IMAGE_TAG}}"
        # ★同时拒绝「空」与「历史可变 tag 0.0.9」。
        #   只判空是不够的：仓库 .env（gitignored）里长期写着 LSP_IMAGE_TAG=0.0.9，
        #   守卫会被存量本地配置**静默绕过** —— 实测确认过。
        if [ -z "$TAG" ] || [ "$TAG" = "0.0.9" ]; then
          cat >&2 <<'MSG'
        ✗ 必须显式指定 LSP_IMAGE_TAG，且必须是不可变 tag（不能是 0.0.9）。

          为什么：生产 lsp 是 aster-lsp:0.0.9 + imagePullPolicy: IfNotPresent，
          往同一 tag 重复推镜像时，有缓存的节点会**静默继续跑旧版本**，
          rollout restart 也换不掉（issue #9）。

          用法：task container:lsp LSP_IMAGE_TAG=$(git -C ../aster-cloud rev-parse HEAD)
          （必须用 task 的 var 语法传；仓库有 dotenv: [.env]，前置环境变量会被 .env 覆盖）

          若你的本地 .env 里有 `LSP_IMAGE_TAG=0.0.9`，请删掉那一行。
        MSG
          exit 1
        fi
      - ./scripts/container-build-push.sh cloud wontlost/aster-lsp {{.LSP_IMAGE_TAG}} --dockerfile Dockerfile.lsp

  # ╔══════════════════════════════════════════╗
  # ║            部署任务（release）             ║
  # ╚══════════════════════════════════════════╝

  deploy:api:
    desc: "【已废弃】aster-api 现由 GitOps digest-pin 发布，本任务不再有效"
    cmds:
      # ★本任务已被 k3s 的统一镜像 digest-pin 架空（issue #8）。
      #
      #   生产 Deployment 由 k3s apps/aster-lang/cloud/kustomization.yaml 的
      #   images transformer 渲染成 `image@sha256:<digest>`，**不是浮动 tag**。
      #   所以「推 jvm-latest + rollout restart」这套动作：
      #     - 推出去的 jvm-latest 没有任何东西会去拉；
      #     - rollout restart 重建的 Pod 仍按同一个 digest 起，版本不变。
      #   即：它会**看起来成功**却什么都没部署——比直接失败更危险。
      #
      #   正确路径：源仓 CI 构建+cosign 签名 → 开 image-pin PR 改 k3s image-lock
      #   与 kustomization → verify-image-pin 验签 → auto-merge → ArgoCD sync。
      - |
        cat >&2 <<'MSG'
        ✗ task deploy:api 已废弃，且**执行它不会部署任何东西**。

          原因：aster-api 生产 Deployment 由 k3s digest-pin 渲染为
                image@sha256:<digest>，浮动 tag jvm-latest 无人拉取，
                rollout restart 只会用同一 digest 重建 Pod。

          正确做法：走 aster-api 源仓 CI 的 image-pin PR 流程
                （构建 → cosign 签名 → PR 改 k3s image-lock → verify → ArgoCD sync）。

          若确需手工重启（仅排障，不换版本）：
                kubectl -n aster-cloud rollout restart deployment/aster-api
        MSG
        exit 1

  deploy:lsp:
    desc: 部署 aster-lsp 到 K3S
    cmds:
      - ./scripts/deploy-k3s.sh lsp

  deploy:cloud:
    desc: 部署 aster-cloud 到 Cloudflare Workers
    cmds:
      - ./scripts/deploy-cloudflare.sh

  # ╔══════════════════════════════════════════╗
  # ║              验证任务                     ║
  # ╚══════════════════════════════════════════╝

  verify:
    desc: 生产环境冒烟测试
    cmds:
      - ./scripts/verify.sh

  verify:local:
    desc: 本地环境冒烟测试
    cmds:
      - ./scripts/verify-local.sh

  verify:test:
    desc: 全栈测试环境冒烟测试
    cmds:
      - ./scripts/verify-test.sh

  # ╔══════════════════════════════════════════╗
  # ║              工具任务                     ║
  # ╚══════════════════════════════════════════╝

  preflight:
    desc: 环境预检
    cmds:
      - ./scripts/preflight.sh {{.MODE | default "dev"}}

  signing-api:dev:
    desc: 启动 license signing API 本地开发服务
    cmds:
      - cd services/license-signing-api && pnpm dev

  signing-api:test:
    desc: 运行 license signing API 测试
    cmds:
      - cd services/license-signing-api && pnpm test

  signing-api:build:
    desc: 构建 license signing API
    cmds:
      - cd services/license-signing-api && pnpm build

  signing-api:image:
    desc: 构建 license signing API 容器镜像
    cmds:
      - cd services/license-signing-api && docker build -t aster-license-signing-api:dev .

  doctor:
    desc: 详细环境诊断
    cmds:
      - echo "=== Aster Deploy 环境诊断 ==="
      - echo ""
      - echo "--- 系统信息 ---"
      - uname -a
      - echo ""
      - echo "--- 工具版本 ---"
      - "java -version 2>&1 || echo 'Java: 未安装'"
      - "node --version 2>/dev/null || echo 'Node: 未安装'"
      - "pnpm --version 2>/dev/null || echo 'pnpm: 未安装'"
      - "podman --version 2>/dev/null || echo 'Podman: 未安装'"
      - "podman-compose version 2>/dev/null || echo 'podman-compose: 未安装'"
      - "kubectl version --client 2>/dev/null || echo 'kubectl: 未安装'"
      - "wrangler --version 2>/dev/null || echo 'wrangler: 未安装'"
      - echo ""
      - task: preflight
        vars: { MODE: release }
