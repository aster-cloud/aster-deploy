{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aster-license-signing-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aster-license-signing-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.adminNamespace | quote }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.vaultNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.vaultPort }}
    # IdP JWKS 与 Slack webhook 的公网出站；cloudflared 是入站隧道，不能当出站代理
    - to:
        {{- /* cidr 兼容旧版单值写法，也可写成列表（生产可收紧为 IdP/Slack 出口白名单） */}}
        {{- range (kindIs "slice" .Values.networkPolicy.publicEgress.cidr | ternary .Values.networkPolicy.publicEgress.cidr (list .Values.networkPolicy.publicEgress.cidr)) }}
        - ipBlock:
            cidr: {{ . | quote }}
            {{- with $.Values.networkPolicy.publicEgress.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
