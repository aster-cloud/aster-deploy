apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-signing-api
  namespace: aster-license-signing
  labels:
    app.kubernetes.io/name: license-signing-api
spec:
  # ★必须单副本（issue #23）：approval / replay / 限流都在进程内存里，两步审批的
  #   /approve 与 /sign 落到不同 Pod 会 404、防重放也只对同一 Pod 生效；
  #   审计 PVC 是 RWO，多副本还会 Multi-Attach。改多副本前须先把这些状态落到共享存储。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: license-signing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: license-signing-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "aster-license-signing-api"
        vault.hashicorp.com/agent-inject-secret-vault-token: "auth/token/lookup-self"
        vault.hashicorp.com/agent-inject-template-vault-token: |
          {{- with secret "auth/token/lookup-self" -}}
          {{ .Data.id }}
          {{- end -}}
    spec:
      serviceAccountName: license-signing-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # P1-R21 (audit): `:latest` is the template default. Production
          # deployments MUST override via `kustomize edit set image
          # docker.io/wontlost/aster-license-signing-api=...:sha-<digest>`
          # before applying. ArgoCD Image Updater handles this on synced
          # clusters; raw kubectl apply users must override manually.
          # `imagePullPolicy: IfNotPresent` here is intentional — once a
          # digest is pinned, pulling on every restart wastes bandwidth.
          image: docker.io/wontlost/aster-license-signing-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: license-signing-api-config
            - secretRef:
                name: license-signing-api-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: audit
              mountPath: /var/log/license-signing-api
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: audit
          persistentVolumeClaim:
            claimName: license-signing-api-audit
        - name: tmp
          emptyDir: {}
