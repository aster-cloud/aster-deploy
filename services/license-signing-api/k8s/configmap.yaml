apiVersion: v1
kind: ConfigMap
metadata:
  name: license-signing-api-config
  namespace: aster-license-signing
data:
  # 非敏感配置；Vault token 由 Vault Agent 写入文件
  PORT: "8443"
  VAULT_ADDR: "https://vault.vault.svc.cluster.local:8200"
  VAULT_TOKEN_FILE: "/vault/secrets/vault-token"
  JWT_ISSUER: "https://idp.aster.com"
  JWT_AUDIENCE: "aster-license-signing-api"
  JWT_JWKS_URL: "https://idp.aster.com/.well-known/jwks.json"
  ALLOWED_KEY_IDS: "^(license|revocation)-signing-v2-[0-9]{4}-[0-9]{2}$"
  AUDIT_LOG_PATH: "/var/log/license-signing-api/audit.jsonl"
  LOG_LEVEL: "info"
