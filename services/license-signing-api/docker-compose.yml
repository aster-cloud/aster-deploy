services:
  vault:
    image: hashicorp/vault:1.17
    container_name: aster-signing-vault-dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.17
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    command:
      - sh
      - -ec
      - |
        vault secrets enable -path=transit transit 2>/dev/null || true
        vault write -f transit/keys/license-signing-v2-2026-01 type=ed25519 exportable=false allow_plaintext_backup=false
        vault write -f transit/keys/revocation-signing-v2-2026-01 type=ed25519 exportable=false allow_plaintext_backup=false

  api:
    build: .
    container_name: aster-license-signing-api-dev
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "8443:8443"
    environment:
      PORT: "8443"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      JWT_ISSUER: https://idp.aster.test
      JWT_AUDIENCE: aster-license-signing-api
      JWT_JWKS_URL: http://host.docker.internal:9999/.well-known/jwks.json
      ALLOWED_KEY_IDS: ^(license|revocation)-signing-v2-[0-9]{4}-[0-9]{2}$
      AUDIT_LOG_PATH: /var/log/license-signing-api/audit.jsonl
      LOG_LEVEL: debug
    volumes:
      - audit:/var/log/license-signing-api

volumes:
  audit:
